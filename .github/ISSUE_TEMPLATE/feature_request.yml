name: Idea or improvement
description: Suggest something that would make the Navigator more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who is it for, and what are they trying to get done?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
